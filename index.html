<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8dcc0">
<meta name="description" content="Aprende a usar el nepohualtzintzin con sesiones interactivas en cuatro lenguas originarias.">
<title>Nepohualtzintzin — Herramienta de conteo</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --red:#B01E1E;--red-light:#D62828;--red-dark:#7A1414;
  --turquoise:#2BB3E0;--turquoise-dark:#156B8C;
  --ocre:#E5A82E;--ocre-dark:#8C6218;--ocre-light:#F2C566;
  --bone:#F0E9D8;
  --amate:#e8dcc0;--amate-1:#d9c9a8;--amate-2:#c9b690;--amate-deep:#b8a478;
  --ink:#2a2018;--ink-2:#5a4a38;--ink-3:#8a7a5e;
  --border:rgba(42,32,24,0.15);--border2:rgba(42,32,24,0.28);
  --verde-tenue:#d4ecd4;--rojo-tenue:#f5d4d4;
  --bg:var(--amate);--bg2:var(--amate-1);--bg3:var(--amate-2);
  --text:var(--ink);--text2:var(--ink-2);--text3:var(--ink-3);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --leather:#2a2018;--leather-2:#1a1410;
  --bead-ocre:#E5A82E;--bead-ocre-shadow:#8C6218;
  --bead-red:#B01E1E;--bead-red-shadow:#5a0f0f;
  --bead-bone:#F0E9D8;--bead-bone-shadow:#a89a80;
  --stitch:#8a7a5e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;font-size:17px;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background-color:var(--amate);
  background-image:
    repeating-linear-gradient(0deg,rgba(140,110,70,0.06) 0px,rgba(140,110,70,0.06) 1px,transparent 1px,transparent 5px),
    repeating-linear-gradient(90deg,rgba(140,110,70,0.04) 0px,rgba(140,110,70,0.04) 1px,transparent 1px,transparent 12px),
    radial-gradient(circle at 15% 20%,rgba(180,140,80,0.15),transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(160,120,70,0.12),transparent 50%),
    radial-gradient(circle at 50% 50%,transparent 30%,rgba(120,90,50,0.05) 100%);
  color:var(--ink);
  font-size:1rem;
  line-height:1.5;
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .6s ease;
}
body.acierto{background-color:var(--verde-tenue);}
body.error{background-color:var(--rojo-tenue);}
.app{max-width:100%;margin:0 auto;padding:0.75rem 1rem calc(2rem + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;}

.header-fixed{
  position:sticky;top:0;z-index:50;
  background:var(--amate);
  background-image:linear-gradient(to bottom,var(--amate) 85%,rgba(232,220,192,0));
  padding:calc(0.7rem + env(safe-area-inset-top)) 1rem 0.7rem;
  margin:calc(-0.75rem - env(safe-area-inset-top)) -1rem 0.5rem;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid var(--red-dark);
  position:relative;
}
.header-fixed::after{
  content:'';position:absolute;left:0;right:0;bottom:-6px;height:3px;
  background-image:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px);
  opacity:.6;
}
.header-title{font-size:1.1rem;font-weight:700;color:var(--ink);letter-spacing:.03em;}
.header-sub{font-size:0.75rem;color:var(--red-dark);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;font-weight:600;}
.header-icon{width:42px;height:28px;}

.screen{display:none;flex:1;}
.screen.active{display:flex;flex-direction:column;}

.btn-p{width:100%;padding:15px;background:var(--red);color:var(--bone);border:none;border-radius:var(--radius);font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:0.6rem;font-family:inherit;letter-spacing:.02em;transition:transform .1s,background .15s;box-shadow:0 3px 0 var(--red-dark);}
.btn-p:hover{background:var(--red-light);}
.btn-p:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-dark);}
.btn-p:disabled{background:var(--amate-2);color:var(--ink-3);cursor:default;box-shadow:0 3px 0 var(--amate-deep);}
.btn-s{width:100%;padding:13px;background:transparent;color:var(--ink-2);border:2px solid var(--border2);border-radius:var(--radius);font-size:1rem;cursor:pointer;margin-bottom:0.5rem;font-family:inherit;font-weight:600;transition:all .15s;}
.btn-s:hover{background:var(--amate-1);color:var(--ink);border-color:var(--ink);}

.logo-wrap{text-align:center;padding:1.5rem 0 1rem;}
.app-title{font-size:1.8rem;font-weight:700;color:var(--ink);letter-spacing:.03em;}
.app-sub{font-size:0.9rem;color:var(--red-dark);letter-spacing:.08em;text-transform:uppercase;margin-top:5px;font-weight:700;}
.quote-box{background:var(--amate-1);border-left:4px solid var(--ocre);padding:1rem 1.2rem;margin:1.25rem 0;border-radius:0 var(--radius) var(--radius) 0;position:relative;}
.quote-box::before{content:'❝';position:absolute;top:-4px;left:10px;font-size:34px;color:var(--ocre);opacity:.35;line-height:1;}
.quote-text{font-size:0.95rem;color:var(--ink);line-height:1.75;font-style:italic;padding-left:1.3rem;}
.quote-author{font-size:0.8rem;color:var(--red-dark);margin-top:8px;font-weight:600;padding-left:1.3rem;}

.deco-divider{height:2px;background-image:repeating-linear-gradient(90deg,var(--red) 0 12px,transparent 12px 24px);margin:1rem 0;opacity:.5;}
.deco-dots{display:flex;gap:8px;justify-content:center;margin:1rem 0;}
.deco-dots span{width:10px;height:10px;border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,0.15);}
.deco-dots span:nth-child(1){background:var(--red);}
.deco-dots span:nth-child(2){background:var(--turquoise);}
.deco-dots span:nth-child(3){background:var(--ocre);}
.deco-dots span:nth-child(4){background:var(--ink);}

.glyph-btn{display:flex;flex-direction:column;align-items:center;padding:1.4rem;background:var(--amate-1);border:2px solid var(--border2);border-radius:var(--radius-lg);cursor:pointer;width:100%;margin-bottom:0.75rem;font-family:inherit;color:var(--ink);transition:all .15s;position:relative;box-shadow:0 3px 0 var(--amate-deep);}
.glyph-btn:hover{border-color:var(--red);background:var(--amate-2);transform:translateY(-2px);}
.glyph-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--amate-deep);}
.glyph-title{font-size:1.15rem;font-weight:700;color:var(--ink);margin-top:0.7rem;}
.glyph-desc{font-size:0.85rem;color:var(--ink-2);margin-top:5px;text-align:center;line-height:1.45;}
/* FIN PEDAZO 1 */
